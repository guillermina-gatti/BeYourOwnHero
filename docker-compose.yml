services:
  db:
    image: postgres:17-alpine
    container_name: beyourownhero-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: beyourownhero
    ports:
      - "5435:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d beyourownhero"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata: